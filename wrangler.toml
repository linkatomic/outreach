name = "outreach"
main = "worker/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Without this, Cloudflare's asset layer tries to match a request against static files
# (and this app's old Pages-only public/_redirects, now removed) BEFORE the Worker script
# below ever runs — a POST to /api/ahrefs was getting a flat, bodyless 405 from the asset
# server itself, never reaching worker/index.js's routing at all. This forces every request
# through the Worker first; it already falls through to env.ASSETS.fetch(request) itself
# for anything that isn't one of its known /api/* routes.
run_worker_first = true
